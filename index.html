<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceEase</title>
  </head>
  <body>
    <main class="app">
      <header class="top-bar">
        <div>
          <p class="eyebrow">FaceEase</p>
          <h1>표정 자연도 분석</h1>
        </div>
        <button id="startButton" type="button">카메라 시작</button>
      </header>

      <section class="camera-panel" aria-label="camera expression analyzer">
        <div class="viewport">
          <video id="camera" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
          <div class="analysis-progress" aria-hidden="true">
            <span id="analysisProgress"></span>
          </div>
        </div>

        <aside class="service-panel" aria-label="service analyzer">
          <p id="status">모델을 불러오는 중...</p>

          <div class="task-tabs" role="group" aria-label="표정 과제 선택">
            <button
              class="task-tab is-active"
              type="button"
              data-task-type="neutral_baseline"
            >
              무표정
            </button>
            <button
              class="task-tab"
              type="button"
              data-task-type="natural_smile"
            >
              미소
            </button>
            <button class="task-tab" type="button" data-task-type="listening">
              경청
            </button>
            <button class="task-tab" type="button" data-task-type="calm">
              차분
            </button>
          </div>

          <div class="task-card">
            <span>선택 과제</span>
            <strong id="taskPrompt">무표정으로 얼굴 기준값을 잡아주세요</strong>
          </div>

          <button
            id="analyzeButton"
            class="primary-action"
            type="button"
            disabled
          >
            5초 분석 시작
          </button>

          <div class="score-grid">
            <div class="grade-card">
              <span>최종 등급</span>
              <strong id="naturalnessGrade" class="grade-result">--</strong>
            </div>
            <div>
              <span>최종 점수</span>
              <strong id="naturalnessScore">--</strong>
            </div>
            <div>
              <span>과제수행 점수</span>
              <strong id="taskScore">--</strong>
            </div>
            <div>
              <span>표정 안정도</span>
              <strong id="negativeScore">--</strong>
            </div>
            <div>
              <span>샘플</span>
              <strong id="serviceSampleCount">0</strong>
            </div>
          </div>

          <div class="feedback-panel">
            <span>피드백</span>
            <ul id="feedbackList">
              <li>분석 결과가 여기에 표시됩니다.</li>
            </ul>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
