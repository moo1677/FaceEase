<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceEase</title>
  </head>
  <body>
    <main class="app">
      <header class="top-bar">
        <div>
          <p class="eyebrow">FaceEase</p>
          <h1>표정 자연도 분석</h1>
        </div>
        <button id="startButton" type="button">카메라 시작</button>
      </header>

      <section class="camera-panel" aria-label="camera expression analyzer">
        <div class="viewport">
          <video id="camera" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
          <div class="analysis-progress" aria-hidden="true">
            <span id="analysisProgress"></span>
          </div>
        </div>

        <aside class="service-panel" aria-label="service analyzer">
          <p id="status">모델을 불러오는 중...</p>

          <div class="task-tabs" role="group" aria-label="표정 과제 선택">
            <button class="task-tab is-active" type="button" data-task-type="natural_smile">미소</button>
            <button class="task-tab" type="button" data-task-type="listening">경청</button>
            <button class="task-tab" type="button" data-task-type="calm">차분</button>
          </div>

          <div class="task-card">
            <span>선택 과제</span>
            <strong id="taskPrompt">자연스러운 미소를 지어보세요</strong>
          </div>

          <button id="analyzeButton" class="primary-action" type="button" disabled>5초 분석 시작</button>

          <div class="score-grid">
            <div>
              <span>자연도</span>
              <strong id="naturalnessScore">--</strong>
            </div>
            <div>
              <span>과제 수행</span>
              <strong id="taskScore">--</strong>
            </div>
            <div>
              <span>부정 패턴</span>
              <strong id="negativeScore">--</strong>
            </div>
            <div>
              <span>샘플</span>
              <strong id="serviceSampleCount">0</strong>
            </div>
          </div>

          <div class="feedback-panel">
            <span>피드백</span>
            <ul id="feedbackList">
              <li>분석 결과가 여기에 표시됩니다.</li>
            </ul>
          </div>

          <dl class="variable-list">
            <div>
              <dt>표정 활성도</dt>
              <dd id="activityValue">--</dd>
            </div>
            <div>
              <dt>움직임</dt>
              <dd id="motionValue">--</dd>
            </div>
            <div>
              <dt>좌우 비대칭</dt>
              <dd id="asymmetryValue">--</dd>
            </div>
            <div>
              <dt>입 긴장</dt>
              <dd id="mouthTensionValue">--</dd>
            </div>
            <div>
              <dt>눈 깜빡임</dt>
              <dd id="blinkValue">--</dd>
            </div>
          </dl>
        </aside>
      </section>

      <details class="collector-panel">
        <summary>라벨 수집 패널</summary>
        <div class="collector-layout">
          <div class="score-grid">
            <div>
              <span>수집 샘플</span>
              <strong id="sampleCount">0</strong>
            </div>
            <div>
              <span>현재 상태</span>
              <strong id="recordState">대기</strong>
            </div>
          </div>

          <form class="label-form" id="labelForm">
            <label>
              자연도 라벨
              <input id="naturalnessTarget" type="number" min="0" max="100" step="1" placeholder="0-100" />
            </label>
            <label>
              경직도 라벨
              <input id="rigidityTarget" type="number" min="0" max="100" step="1" placeholder="0-100" />
            </label>
          </form>

          <div class="collector-actions">
            <button id="snapshotButton" type="button" disabled>샘플 1개 저장</button>
            <button id="recordButton" type="button" disabled>연속 수집</button>
            <button id="downloadButton" type="button" disabled>CSV 다운로드</button>
            <button id="clearButton" type="button" disabled>초기화</button>
          </div>
        </div>
      </details>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
